<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منوی دیجیتال مجموعه حاجی حیدری</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=Lalezar&display=swap">
<style>
:root{--bg:#041033;--surface:#07194a;--ink:#fff;--muted:#aab6d3;--accent:#f0c35a;--gold:#f0c35a;--navy:#041033;--line:rgba(240,195,90,.35);--chip:#0a1f55;--bad:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#041033;--surface:#07194a;--ink:#fff;--muted:#aab6d3;--accent:#f0c35a;--gold:#f0c35a;--navy:#041033;--line:rgba(240,195,90,.35);--chip:#0a1f55;--bad:#d9534f}}
:root[data-theme="dark"]{--bg:#041033;--surface:#07194a;--ink:#fff;--muted:#aab6d3;--accent:#f0c35a;--gold:#f0c35a;--navy:#041033;--line:rgba(240,195,90,.35);--chip:#0a1f55;--bad:#d9534f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.8}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1220px;margin:0 auto;padding:0 16px 120px}
header{padding:36px 0 26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}header .sub{color:var(--gold);font-size:18px}.tg{margin:0;color:var(--muted)}.big{padding:10px 38px;font-size:17px;margin-top:12px;text-decoration:none;display:inline-block}.st{text-align:center;font-size:30px;margin:26px 0 0}.st+.tg{text-align:center;margin-bottom:6px}html{overflow-x:clip}header.hero{position:relative;width:100vw;margin-inline:calc(50% - 50vw);min-height:420px;justify-content:center;padding:48px 16px;overflow:hidden}.slides,.slides .sl{position:absolute;inset:0}.slides::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(4,16,51,.55),rgba(4,16,51,.88))}.sl{background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s}.sl.on{opacity:1}header.hero>:not(.slides):not(.dots){position:relative;z-index:1}.dots{position:absolute;bottom:14px;display:flex;gap:8px;z-index:1}.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.4)}.dots i.on{background:var(--gold)}
.logo{width:96px;height:96px;border-radius:50%;background:var(--gold);color:#13294b;display:grid;place-items:center;font-size:30px;font-weight:800;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
h1,h2{font-family:"Lalezar","Vazirmatn",Tahoma,sans-serif;font-weight:400}h1{margin:0;font-size:clamp(34px,9vw,64px);font-weight:400;line-height:1.3;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.5)}
.sub{color:var(--muted);margin:0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);padding:10px 0;border-bottom:1px solid var(--line);box-shadow:0 0 0 100vmax var(--navy);clip-path:inset(0 -100vmax)}.bar .chip{background:var(--chip);border:1px solid rgba(255,255,255,.18);color:#fff;padding:7px 20px}.bar .chip.on{background:linear-gradient(#f6d682,#c9a24a);color:#13294b;border-color:transparent}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:5px 16px;cursor:pointer;font-size:14px}
.chip.on{background:var(--gold);color:#13294b;font-weight:700}
button:focus-visible,.in:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h2{font-size:21px;margin:30px 0 8px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.img{position:relative;aspect-ratio:1/1;background:var(--chip);display:grid;place-items:center;font-size:40px}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.out .img img{filter:grayscale(1) opacity(.6)}
.soldout{position:absolute;background:var(--bad);color:#fff;border-radius:8px;padding:0 14px;font-size:15px}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.name{font-weight:800;font-size:20px;display:block}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:10px}
.price{font-weight:700;white-space:nowrap}.price small{font-weight:400;color:var(--muted);font-size:12px;margin-inline-start:3px}
.desc{margin:0;color:var(--muted);font-size:14px;flex:1}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}.foot .price{color:var(--gold);font-size:18px}.add{width:46px;height:40px;border-radius:10px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:24px;cursor:pointer}.add:disabled{opacity:.35;cursor:not-allowed}.bdg{position:absolute;top:10px;right:10px;background:#0e8a55;color:#fff;border-radius:8px;padding:0 12px;font-size:14px;font-weight:700;z-index:1}.bdg.no{background:var(--bad)}
.btn{border:0;background:var(--gold);color:#13294b;border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:700}
.btn:disabled{background:var(--chip);color:var(--muted);cursor:not-allowed}
.btn.alt{background:var(--chip);color:var(--ink);font-weight:500}.btn.red{background:var(--bad);color:#fff}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.dock{position:fixed;inset:auto 0 0 0;margin:0 auto calc(10px + env(safe-area-inset-bottom,0px));width:min(720px,94vw);padding:8px 10px;background:#06133d;border:1px solid var(--line);border-radius:18px;display:flex;gap:10px;justify-content:center;z-index:6}
.dock .btn{flex:1;max-width:340px;padding:10px}
dialog{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;width:min(560px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog.big{width:min(820px,96vw)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.dh b{font-size:18px}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.li .grow{flex:1}
.q{display:flex;align-items:center;gap:6px}.q button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:12px 0}
.stars button{background:none;border:0;font-size:28px;cursor:pointer;color:var(--line);padding:0 2px}.stars button.on{color:#f0a500}
.rv{padding:12px 0;border-bottom:1px solid var(--line)}.rv p{margin:2px 0}
.f{display:grid;gap:8px;margin:8px 0}.f label{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--chip);flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap}.acts .btn{padding:3px 10px;font-size:13px}
footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
#toast{position:fixed;inset:auto 16px calc(80px + env(safe-area-inset-bottom,0px)) 16px;margin:auto;max-width:420px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;text-align:center;z-index:50;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo" id="logo"></div><h1 id="shop"></h1><p class="sub">منوی دیجیتال</p><p class="tg">طعم اصیل، تجربه‌ای ماندگار</p><a class="btn big" href="#q">مشاهده منو</a></header>
  <div class="bar"><input class="in" id="q" type="search" placeholder="جستجوی غذا…" aria-label="جستجو"><div class="chips" id="chips"></div></div>
  <h2 class="st">منوی ما</h2><p class="tg">غذا را انتخاب کنید و مستقیم به سبد سفارش اضافه کنید.</p>
  <main id="menu"></main>
  <h2 id="rvh">⭐ نظر و امتیاز مشتریان</h2>
  <div class="card" style="padding:14px">
    <div class="f"><input class="in" id="rn" placeholder="نام (اختیاری)" maxlength="40">
    <div class="stars" id="stars" role="group" aria-label="امتیاز"></div>
    <textarea class="in" id="rt" rows="3" placeholder="نظر شما…" maxlength="400"></textarea>
    <button class="btn" data-a="rv">ثبت نظر</button></div>
  </div>
  <div id="rvs"></div>
  <footer><span>© مجموعه حاجی حیدری</span></footer>
</div>
<div class="dock"><button class="btn alt" data-a="call">🔔 فراخوان گارسون</button><button class="btn" data-a="cart" id="cartBtn">🛒 سبد خرید</button></div>
<dialog id="cartD"><div class="dh"><b>سبد خرید</b><button class="btn alt" data-a="close">بستن</button></div><div id="cartB"></div></dialog>

<div id="toast" role="status"></div>
<script>
/* ---------- لایه ذخیره‌سازی (برای انتقال به دیتابیس واقعی فقط همین بخش عوض شود) ---------- */
const Store={
  get(k,d){try{const v=localStorage.getItem('hh_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('hh_'+k,JSON.stringify(v));return true}catch(e){toast('حافظه پر است؛ تصویر کوچک‌تری انتخاب کنید');return false}}
};
/* ---------- داده ---------- */
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const $=id=>document.getElementById(id),fa=n=>Number(n).toLocaleString('fa-IR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){
  const names=['کباب','پیتزا','غذا','آبمیوه','نوشیدنی سرد','سینی ها','مخصوص ها','ساده ها'];
  const cats=names.map((n,i)=>({id:'c'+(i+1),name:n}));
  const F=(c,n,p,d)=>({id:uid('f'),name:n,price:p,cat:c,img:'',desc:d,stock:true});
  return{set:{name:'مجموعه حاجی حیدری',logo:'',pin:'1234'},cats,foods:[
    F('c1','کباب کوبیده',350,'دو سیخ کباب گوشت، با نان و سلاد'),F('c1','چپلی کباب',300,'چپلی کباب سنتی با نان تازه'),
    F('c2','پیتزا مخصوص',650,'گوشت، قارچ، فلفل و پنیر'),F('c3','قابلی پلو',420,'برنج، گوشت، هویج و کشمش'),
    F('c4','آبمیوه مخلوط',120,'میوه‌های تازهٔ فصل'),F('c5','نوشابه',40,'بطری کوچک'),
    F('c6','سینی مخصوص دو نفره',1200,'کباب، برنج، سلاد و نوشابه'),F('c8','نان و سلاد',60,'ساده و تازه')]};
}
let D=Store.get('data',null);if(!D){D=seed();Store.set('data',D)}
let cart=Store.get('cart',{}),reviews=Store.get('reviews',[]),active='all',stars=0,authed=false,tab='foods',editId=null,img64='';
const save=()=>Store.set('data',D);
/* ---------- نمایش منو ---------- */
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function head(){$('shop').textContent=D.set.name;$('logo').innerHTML=D.set.logo?`<img src="${D.set.logo}" alt="لوگو">`:'ح'}
function chips(){$('chips').innerHTML=[{id:'all',name:'همه'},...D.cats].map(c=>`<button class="chip ${active===c.id?'on':''}" data-a="cat" data-v="${c.id}">${esc(c.name)}</button>`).join('')}
function card(f){const ok=f.stock;return`<article class="card ${ok?'':'out'}"><div class="img">${f.img?`<img src="${f.img}" alt="${esc(f.name)}" loading="lazy">`:'🍽'}<span class="bdg ${ok?'':'no'}">${ok?'موجود':'تمام شد'}</span></div><div class="body"><span class="name">${esc(f.name)}</span><p class="desc">${esc(f.desc)}</p><div class="foot"><span class="price">${fa(f.price)} افغانی</span><button class="add" data-a="add" data-v="${f.id}" ${ok?'':'disabled'} aria-label="افزودن به سبد" title="افزودن به سبد">+</button></div></div></article>`}
function menu(){
  const t=$('q').value.trim();let h='';
  D.cats.forEach(c=>{if(active!=='all'&&active!==c.id)return;
    const L=D.foods.filter(f=>f.cat===c.id&&(!t||(f.name+' '+f.desc).includes(t)));
    if(L.length)h+=`<h2>${esc(c.name)}</h2><div class="grid">${L.map(card).join('')}</div>`});
  $('menu').innerHTML=h||'<p class="empty">غذایی پیدا نشد.</p>';
}
/* ---------- سبد خرید ---------- */
const cartLines=()=>Object.entries(cart).map(([id,n])=>({f:D.foods.find(x=>x.id===id),n})).filter(x=>x.f);
function cartUI(){
  const L=cartLines(),sum=L.reduce((s,x)=>s+x.f.price*x.n,0),cnt=L.reduce((s,x)=>s+x.n,0);
  $('cartBtn').textContent=cnt?`🛒 ${fa(cnt)} قلم — ${fa(sum)} افغانی · مشاهده و ثبت سفارش`:'🛒 سبد خرید';
  $('cartB').innerHTML=L.length?L.map(x=>`<div class="li"><div class="grow"><b>${esc(x.f.name)}</b><br><small>${fa(x.f.price)} افغانی</small></div><div class="q"><button data-a="dec" data-v="${x.f.id}" aria-label="کم">−</button><b>${fa(x.n)}</b><button data-a="inc" data-v="${x.f.id}" aria-label="زیاد">+</button></div><button class="btn red" data-a="rm" data-v="${x.f.id}">حذف</button></div>`).join('')+`<div class="tot"><span>مجموع</span><span>${fa(sum)} افغانی</span></div>`:'<p class="empty">سبد خرید خالی است.</p>';
}
function setQty(id,d){const f=D.foods.find(x=>x.id===id);if(!f||!f.stock&&d>0)return;const n=(cart[id]||0)+d;if(n<=0)delete cart[id];else cart[id]=n;Store.set('cart',cart);cartUI()}
/* ---------- نظرات ---------- */
function stars_(){$('stars').innerHTML=[1,2,3,4,5].map(i=>`<button class="${i<=stars?'on':''}" data-a="star" data-v="${i}" aria-label="${i} ستاره">★</button>`).join('')}
function rvs(){const a=reviews.length?(reviews.reduce((s,r)=>s+r.s,0)/reviews.length).toFixed(1):0;
  $('rvs').innerHTML=(reviews.length?`<p class="sub" style="margin-top:12px">میانگین امتیاز: ${fa(a)} از ۵ (${fa(reviews.length)} نظر)</p>`:'<p class="empty">هنوز نظری ثبت نشده است.</p>')+reviews.slice().reverse().map(r=>`<div class="rv"><b>${esc(r.n||'مهمان')}</b> <span style="color:#f0a500">${'★'.repeat(r.s)}</span><p>${esc(r.t)}</p></div>`).join('')}
/* ---------- پنل مدیریت ---------- */
const catName=id=>(D.cats.find(c=>c.id===id)||{name:'—'}).name;
function adm(){
  const B=$('admB');
  if(!authed){B.innerHTML='<div class="f"><label>رمز مدیریت</label><input class="in" id="pin" type="password" inputmode="numeric" autocomplete="off"><button class="btn" data-a="login">ورود</button><small class="sub">رمز پیش‌فرض: ۱۲۳۴ (بعد از ورود تغییر دهید)</small></div>';return}
  const T=`<div class="tabs">${[['foods','غذاها'],['cats','دسته‌بندی‌ها'],['set','تنظیمات']].map(([k,n])=>`<button class="chip ${tab===k?'on':''}" data-a="tab" data-v="${k}">${n}</button>`).join('')}</div>`;
  if(tab==='foods'){const e=D.foods.find(f=>f.id===editId)||{name:'',price:'',cat:D.cats[0]?.id,desc:'',stock:true,img:''};
    B.innerHTML=T+`<div class="card" style="padding:12px"><b>${editId?'ویرایش غذا':'افزودن غذای جدید'}</b><div class="f"><input class="in" id="fn" placeholder="نام غذا" value="${esc(e.name)}"><input class="in" id="fp" type="number" min="0" placeholder="قیمت (افغانی)" value="${esc(e.price)}"><select class="in" id="fc">${D.cats.map(c=>`<option value="${c.id}" ${c.id===e.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select><textarea class="in" id="fd" rows="2" placeholder="توضیحات کوتاه">${esc(e.desc)}</textarea><select class="in" id="fs"><option value="1" ${e.stock?'selected':''}>🟢 موجود</option><option value="0" ${e.stock?'':'selected'}>🔴 تمام شده</option></select><label>تصویر ${e.img?'(تصویر فعلی حفظ می‌شود مگر تصویر جدید انتخاب کنید)':''}</label><input type="file" id="ff" accept="image/*"><div class="acts"><button class="btn" data-a="fsave">${editId?'ذخیره تغییرات':'افزودن غذا'}</button>${editId?'<button class="btn alt" data-a="fcancel">انصراف</button>':''}</div></div></div><p class="sub">${fa(D.foods.length)} غذا در منو</p>`+D.foods.map(f=>`<div class="li">${f.img?`<img class="thumb" src="${f.img}" alt="">`:'<div class="thumb"></div>'}<div class="grow"><b>${esc(f.name)}</b><br><small>${fa(f.price)} افغانی · ${esc(catName(f.cat))}</small></div><div class="acts"><button class="btn alt" data-a="fstock" data-v="${f.id}">${f.stock?'🟢 موجود':'🔴 تمام شده'}</button><button class="btn alt" data-a="fedit" data-v="${f.id}">ویرایش</button><button class="btn red" data-a="fdel" data-v="${f.id}">حذف</button></div></div>`).join('')}
  else if(tab==='cats')B.innerHTML=T+`<div class="f"><input class="in" id="cn" placeholder="نام دسته‌بندی جدید"><button class="btn" data-a="cadd">افزودن دسته‌بندی</button></div>`+D.cats.map(c=>`<div class="li"><input class="in grow" data-a="cren" data-v="${c.id}" value="${esc(c.name)}"><small>${fa(D.foods.filter(f=>f.cat===c.id).length)} غذا</small><button class="btn red" data-a="cdel" data-v="${c.id}">حذف</button></div>`).join('');
  else B.innerHTML=T+`<div class="f"><label>نام مجموعه</label><input class="in" id="sn" value="${esc(D.set.name)}"><label>لوگو</label><input type="file" id="sl" accept="image/*"><label>رمز مدیریت جدید (خالی = بدون تغییر)</label><input class="in" id="sp" type="password" inputmode="numeric"><button class="btn" data-a="ssave">ذخیره تنظیمات</button></div>`;
}
const shrink=file=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.78))};im.src=fr.result};fr.readAsDataURL(file)});
function refresh(){head();chips();menu();cartUI()}
/* ---------- رویدادها ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='INPUT')return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='fdel'||a==='cdel'){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='مطمئنید؟';setTimeout(()=>{delete b.dataset.sure;b.textContent='حذف'},3000);return}}
  switch(a){
    case'cat':active=v;chips();menu();break;
    case'add':setQty(v,1);toast('به سبد خرید اضافه شد');break;
    case'inc':setQty(v,1);break;case'dec':setQty(v,-1);break;case'rm':delete cart[v];Store.set('cart',cart);cartUI();break;
    case'cart':cartUI();$('cartD').showModal();break;
    case'close':b.closest('dialog').close();break;
    case'call':{const c=Store.get('calls',[]);c.push({t:Date.now()});Store.set('calls',c);toast('🔔 درخواست شما ثبت شد؛ گارسون به‌زودی می‌آید.');break}
    case'star':stars=+v;stars_();break;
    case'rv':{const t=$('rt').value.trim();if(!stars||!t){toast('لطفاً امتیاز و نظر را وارد کنید');break}
      reviews.push({n:$('rn').value.trim(),s:stars,t,d:Date.now()});Store.set('reviews',reviews);stars=0;$('rn').value='';$('rt').value='';stars_();rvs();toast('نظر شما ثبت شد. ممنون!');break}
    case'theme':{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=d?'light':'dark';break}
    case'adm':adm();$('admD').showModal();break;
    case'login':if($('pin').value===D.set.pin){authed=true;adm()}else toast('رمز نادرست است');break;
    case'tab':tab=v;editId=null;adm();break;
    case'fsave':{const n=$('fn').value.trim(),p=parseFloat($('fp').value);if(!n||isNaN(p)||p<0||!D.cats.length){toast('نام، قیمت و دسته‌بندی را کامل وارد کنید');break}
      const file=$('ff').files[0],im=file?await shrink(file):null,old=D.foods.find(f=>f.id===editId);
      const o={name:n,price:p,cat:$('fc').value,desc:$('fd').value.trim(),stock:$('fs').value==='1'};
      if(old)Object.assign(old,o,im?{img:im}:{});else D.foods.push({id:uid('f'),img:im||'',...o});
      if(save()){editId=null;refresh();adm();toast('ذخیره شد')}break}
    case'fedit':editId=v;adm();$('admD').scrollTo(0,0);break;case'fcancel':editId=null;adm();break;
    case'fstock':{const f=D.foods.find(x=>x.id===v);f.stock=!f.stock;if(!f.stock){delete cart[v];Store.set('cart',cart)}save();refresh();adm();break}
    case'fdel':D.foods=D.foods.filter(f=>f.id!==v);delete cart[v];Store.set('cart',cart);save();refresh();adm();break;
    case'cadd':{const n=$('cn').value.trim();if(!n)break;D.cats.push({id:uid('c'),name:n});save();refresh();adm();break}
    case'cdel':if(D.foods.some(f=>f.cat===v)){toast('ابتدا غذاهای این دسته را منتقل یا حذف کنید');adm();break}
      D.cats=D.cats.filter(c=>c.id!==v);if(active===v)active='all';save();refresh();adm();break;
    case'ssave':{D.set.name=$('sn').value.trim()||D.set.name;const lf=$('sl').files[0];if(lf)D.set.logo=await shrink(lf);const p=$('sp').value.trim();if(p)D.set.pin=p;if(save()){refresh();toast('تنظیمات ذخیره شد')}break}
  }
});
document.addEventListener('change',e=>{const i=e.target;if(i.dataset.a==='cren'){const c=D.cats.find(x=>x.id===i.dataset.v);if(c&&i.value.trim()){c.name=i.value.trim();save();refresh()}}});
$('q').addEventListener('input',menu);
/* عکس‌های اسلایدشو (فایل تصویر به صورت data URI)؛ خالی = بدون اسلایدشو */
const SLIDES=[];
function hero(){if(!SLIDES.length)return;const h=document.querySelector('header');h.classList.add('hero');
 const w=document.createElement('div');w.className='slides';w.innerHTML=SLIDES.map((s,i)=>`<div class="sl${i?'':' on'}" style="background-image:url('${s}')"></div>`).join('');h.prepend(w);
 const d=document.createElement('div');d.className='dots';d.innerHTML=SLIDES.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');h.append(d);
 let i=0;if(SLIDES.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(()=>{const s=w.children,p=d.children;s[i].classList.remove('on');p[i].classList.remove('on');i=(i+1)%s.length;s[i].classList.add('on');p[i].classList.add('on')},5000)}
hero();refresh();stars_();rvs();
</script>
</body>
